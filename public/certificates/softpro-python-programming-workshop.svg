<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="#ffffff" />
  
  <!-- Outer Orange/Gold Frame -->
  <rect x="25" y="25" width="1150" height="750" fill="none" stroke="#ea580c" stroke-width="14" rx="4" />
  <rect x="42" y="42" width="1116" height="716" fill="none" stroke="#f97316" stroke-width="3" rx="2" />

  <!-- Corner Geometric Art Accents -->
  <polygon points="50,50 220,50 50,220" fill="#eab308" opacity="0.9" />
  <polygon points="1150,50 980,50 1150,220" fill="#eab308" opacity="0.9" />
  <polygon points="50,750 220,750 50,580" fill="#f97316" opacity="0.9" />
  <polygon points="1150,750 980,750 1150,580" fill="#f97316" opacity="0.9" />

  <!-- Certificate Title -->
  <text x="600" y="150" font-family="'Space Grotesk', system-ui, sans-serif" font-size="46" font-weight="700" fill="#0f172a" text-anchor="middle">Workshop Completion Certificate</text>
  <text x="600" y="190" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle">Certificate No. SPI/26791</text>

  <!-- Certification Text Body -->
  <text x="600" y="240" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="middle">This is to certify that</text>
  <text x="600" y="295" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="800" fill="#ea580c" text-anchor="middle">Pappu Kumar</text>
  <text x="600" y="340" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#334155" text-anchor="middle">from <tspan font-weight="700">Rajkiya Engineering College, Banda</tspan></text>
  
  <text x="600" y="390" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="middle">Participated in the workshop on</text>
  <text x="600" y="440" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="700" fill="#0f172a" text-anchor="middle">Python Programming</text>
  <text x="600" y="480" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="middle">dated 11-09-2025 &amp; 12-09-2025</text>
  
  <text x="600" y="525" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="24" font-weight="600" fill="#c2410c" text-anchor="middle">"A Journey from Beginner to Expert"</text>

  <!-- Softpro Logo Mockup -->
  <g transform="translate(140, 530)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="#ea580c" stroke-width="6" />
    <text x="50" y="60" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="900" fill="#ea580c" text-anchor="middle">SPI</text>
  </g>

  <!-- Organizer Details -->
  <text x="600" y="585" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="middle">Organized By</text>
  <text x="600" y="618" font-family="'Space Grotesk', system-ui, sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="middle">SOFTPRO INDIA</text>
  <text x="600" y="642" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">COMPUTER TECHNOLOGIES PVT. LTD.</text>
  <text x="600" y="662" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">An ISO 9001:2015 Certified Company | Associate Member of UPDESCO</text>

  <!-- Signatory -->
  <g transform="translate(600, 710)">
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#94a3b8" stroke-width="1.5" />
    <text x="0" y="20" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Director, Softpro India</text>
  </g>
</svg>
