<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#ffffff" />
  
  <!-- Outer Frame -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#f97316" stroke-width="8" rx="8" />
  <rect x="44" y="44" width="1112" height="712" fill="none" stroke="#0f172a" stroke-width="2" rx="4" />

  <!-- Logo Header -->
  <g transform="translate(530, 80)">
    <circle cx="30" cy="30" r="28" fill="#f97316" />
    <path d="M 30,12 L 42,42 L 18,42 Z" fill="#ffffff" />
    <text x="75" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="900" fill="#0f172a">YCAT</text>
    <text x="75" y="55" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b">INTERNSHIP COMMON APTITUDE TEST</text>
  </g>

  <!-- Title -->
  <text x="600" y="230" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="2">CERTIFICATE OF PARTICIPATION</text>
  <text x="600" y="275" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="1.5">THIS CERTIFICATE IS PROUDLY PRESENTED TO</text>

  <!-- Name -->
  <text x="600" y="360" font-family="'Space Grotesk', system-ui, sans-serif" font-size="52" font-weight="800" fill="#ea580c" text-anchor="middle">PAPPU GUPTA</text>
  <line x1="250" y1="390" x2="950" y2="390" stroke="#cbd5e1" stroke-width="2" />

  <!-- Content -->
  <text x="600" y="440" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="400" fill="#334155" text-anchor="middle">for participating in the <tspan font-weight="800" fill="#0f172a">Internship Common Aptitude Test</tspan>.</text>
  <text x="600" y="480" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">We commend your dedication and effort and extend our best wishes for your continued success.</text>

  <!-- Footer Dates -->
  <g transform="translate(200, 640)">
    <line x1="0" y1="0" x2="260" y2="0" stroke="#0f172a" stroke-width="2" />
    <text x="130" y="-12" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">24th June, 2026</text>
    <text x="130" y="24" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle">Date</text>
  </g>

  <g transform="translate(740, 640)">
    <line x1="0" y1="0" x2="260" y2="0" stroke="#0f172a" stroke-width="2" />
    <text x="130" y="-12" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">CIT-P-3464512</text>
    <text x="130" y="24" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle">Certificate Number</text>
  </g>
</svg>
