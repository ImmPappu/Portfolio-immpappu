<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="blueFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="#ffffff" />
  
  <!-- Outer Blue Border Frame -->
  <rect x="25" y="25" width="1150" height="750" fill="none" stroke="#2563eb" stroke-width="12" rx="4" />
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#93c5fd" stroke-width="2" rx="2" />

  <!-- Left Ribbon Background Accent -->
  <rect x="140" y="40" width="90" height="720" fill="#e0f2fe" opacity="0.6" />

  <!-- Unstop Badge Seal -->
  <g transform="translate(135, 120)">
    <circle cx="50" cy="50" r="55" fill="#1d4ed8" filter="url(#shadow)" />
    <path d="M 50,-10 L 60,10 L 80,10 L 65,25 L 72,45 L 50,32 L 28,45 L 35,25 L 20,10 L 40,10 Z" fill="#ffffff" transform="translate(0, 15) scale(0.6)" />
    <circle cx="50" cy="50" r="42" fill="#ffffff" />
    <text x="50" y="56" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="800" fill="#1e40af" text-anchor="middle">unstop</text>
    <!-- Blue Ribbon Hanging Tails -->
    <path d="M 30,95 L 45,150 L 50,140 L 55,150 L 70,95 Z" fill="#1e40af" />
  </g>

  <!-- Main Certificate Header -->
  <text x="370" y="220" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="700" fill="#0f172a">Certificate of Completion</text>
  <text x="370" y="270" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#64748b">Presented to</text>
  
  <!-- Recipient Name -->
  <text x="370" y="340" font-family="'Space Grotesk', system-ui, sans-serif" font-size="52" font-weight="800" fill="#1e293b">Pappu Kumar</text>
  <line x1="370" y1="365" x2="950" y2="365" stroke="#cbd5e1" stroke-width="2" />

  <!-- Course Details -->
  <text x="370" y="420" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="400" fill="#475569">for successfully completing the course</text>
  <text x="370" y="465" font-family="'Space Grotesk', system-ui, sans-serif" font-size="30" font-weight="700" fill="#2563eb">Cloud Computing with AI</text>
  <text x="370" y="505" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="400" fill="#475569">provided by <tspan font-weight="700" fill="#0f172a">Unstop</tspan>.</text>

  <!-- Signature Section -->
  <g transform="translate(370, 600)">
    <path d="M 10 40 Q 30 10 50 35 T 90 20 T 120 45 T 150 15" stroke="#0f172a" stroke-width="3" fill="none" />
    <line x1="0" y1="55" x2="220" y2="55" stroke="#94a3b8" stroke-width="1.5" />
    <text x="0" y="78" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Ankit Aggarwal</text>
    <text x="0" y="98" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b">CEO, Unstop</text>
  </g>

  <!-- QR Code Mockup -->
  <g transform="translate(980, 580)">
    <rect x="0" y="0" width="110" height="110" fill="#ffffff" stroke="#0f172a" stroke-width="4" rx="6" />
    <rect x="12" y="12" width="30" height="30" fill="#0f172a" />
    <rect x="18" y="18" width="18" height="18" fill="#ffffff" />
    <rect x="23" y="23" width="8" height="8" fill="#0f172a" />
    
    <rect x="68" y="12" width="30" height="30" fill="#0f172a" />
    <rect x="74" y="18" width="18" height="18" fill="#ffffff" />
    <rect x="79" y="23" width="8" height="8" fill="#0f172a" />

    <rect x="12" y="68" width="30" height="30" fill="#0f172a" />
    <rect x="18" y="74" width="18" height="18" fill="#ffffff" />
    <rect x="23" y="79" width="8" height="8" fill="#0f172a" />

    <rect x="50" y="50" width="15" height="15" fill="#0f172a" />
    <rect x="70" y="70" width="25" height="25" fill="#0f172a" />
    <rect x="50" y="75" width="12" height="12" fill="#0f172a" />
  </g>
</svg>
